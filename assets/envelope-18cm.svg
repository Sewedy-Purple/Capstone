<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Nexus N1 mechanical envelope drawing, 180 mm overall length">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#183356" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb4e8"/>
    </marker>
    <linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2f4d"/>
      <stop offset="100%" stop-color="#0f1f35"/>
    </linearGradient>
  </defs>

  <rect width="760" height="560" fill="#0B1F3A"/>
  <rect width="760" height="560" fill="url(#grid)" opacity="0.55"/>

  <!-- title block -->
  <text x="28" y="38" font-family="monospace" font-size="13" fill="#cfe0f5" letter-spacing="3">NEXUS N1 · MECHANICAL ENVELOPE</text>
  <text x="28" y="56" font-family="monospace" font-size="10" fill="#6d8bb0">SCALE 1:1 · ALL DIMENSIONS IN MILLIMETRES</text>
  <line x1="28" y1="66" x2="732" y2="66" stroke="#1e3a5f" stroke-width="1"/>

  <!-- ===================== TOP VIEW ===================== -->
  <text x="28" y="92" font-family="monospace" font-size="10" fill="#8fb4e8" letter-spacing="2">TOP VIEW</text>

  <g transform="translate(90 106)">
    <!-- body 540 x 138 (180x46 mm at 3x) -->
    <rect x="0" y="0" width="540" height="138" rx="18" fill="url(#bodyg)" stroke="#5a7a9a" stroke-width="1.4"/>

    <!-- inner seam -->
    <rect x="6" y="6" width="528" height="126" rx="14" fill="none" stroke="#28456b" stroke-width="0.6"/>

    <!-- lens barrel -->
    <circle cx="78" cy="69" r="26" fill="#050b15" stroke="#3f5d84" stroke-width="1"/>
    <circle cx="78" cy="69" r="16" fill="#132a44"/>
    <circle cx="78" cy="69" r="8" fill="#0a1424"/>

    <!-- LED -->
    <circle cx="452" cy="42" r="4" fill="#E03A3A"/>
    <circle cx="452" cy="42" r="7" fill="none" stroke="#E03A3A" stroke-width="0.6" opacity="0.5"/>

    <!-- vent slots -->
    <g fill="#050b15" opacity="0.9">
      <rect x="474" y="52" width="3" height="40" rx="1.5"/>
      <rect x="484" y="52" width="3" height="40" rx="1.5"/>
      <rect x="494" y="52" width="3" height="40" rx="1.5"/>
      <rect x="504" y="52" width="3" height="40" rx="1.5"/>
    </g>

    <!-- microSD slot (side) -->
    <rect x="516" y="118" width="22" height="8" rx="1" fill="#050b15" stroke="#3f5d84" stroke-width="0.6"/>

    <!-- ball-joint mount center -->
    <circle cx="270" cy="69" r="7" fill="none" stroke="#6d8bb0" stroke-dasharray="2 2" stroke-width="0.8"/>
    <line x1="263" y1="69" x2="277" y2="69" stroke="#6d8bb0" stroke-width="0.5"/>
    <line x1="270" y1="62" x2="270" y2="76" stroke="#6d8bb0" stroke-width="0.5"/>
  </g>

  <!-- length dimension 180 -->
  <g stroke="#8fb4e8" fill="#8fb4e8" font-family="monospace" font-size="10">
    <line x1="90" y1="272" x2="630" y2="272" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="90" y1="258" x2="90" y2="286" stroke-width="1"/>
    <line x1="630" y1="258" x2="630" y2="286" stroke-width="1"/>
    <text x="360" y="266" text-anchor="middle" fill="#cfe0f5" stroke="none">180.0 mm — overall length</text>
  </g>

  <!-- width dimension 46 -->
  <g stroke="#8fb4e8" fill="#8fb4e8" font-family="monospace" font-size="10">
    <line x1="668" y1="106" x2="668" y2="244" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="652" y1="106" x2="684" y2="106" stroke-width="1"/>
    <line x1="652" y1="244" x2="684" y2="244" stroke-width="1"/>
    <text x="700" y="180" fill="#cfe0f5" stroke="none">46.0</text>
  </g>

  <!-- ===================== SIDE VIEW ===================== -->
  <text x="28" y="316" font-family="monospace" font-size="10" fill="#8fb4e8" letter-spacing="2">SIDE VIEW</text>

  <g transform="translate(90 330)">
    <!-- body 540 x 96 (180 x 32 mm at 3x) -->
    <rect x="0" y="0" width="540" height="96" rx="18" fill="url(#bodyg)" stroke="#5a7a9a" stroke-width="1.4"/>

    <!-- lens protrusion -->
    <path d="M 56 22 L 56 74 L 18 74 L 18 22 Z" fill="#050b15" stroke="#3f5d84" stroke-width="1"/>
    <circle cx="37" cy="48" r="16" fill="#132a44"/>
    <circle cx="37" cy="48" r="7" fill="#0a1424"/>

    <!-- top vent hint -->
    <g fill="#050b15" opacity="0.85">
      <rect x="480" y="6" width="3" height="14" rx="1.5"/>
      <rect x="490" y="6" width="3" height="14" rx="1.5"/>
      <rect x="500" y="6" width="3" height="14" rx="1.5"/>
    </g>

    <!-- mount stem + ball -->
    <rect x="256" y="96" width="28" height="16" fill="#132a44" stroke="#3f5d84" stroke-width="0.8"/>
    <circle cx="270" cy="124" r="10" fill="#0a1424" stroke="#5a7a9a" stroke-width="0.9"/>
    <circle cx="270" cy="124" r="4" fill="#1b2f4d"/>
  </g>

  <!-- height dimension 32 -->
  <g stroke="#8fb4e8" fill="#8fb4e8" font-family="monospace" font-size="10">
    <line x1="668" y1="330" x2="668" y2="426" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="652" y1="330" x2="684" y2="330" stroke-width="1"/>
    <line x1="652" y1="426" x2="684" y2="426" stroke-width="1"/>
    <text x="700" y="382" fill="#cfe0f5" stroke="none">32.0</text>
  </g>

  <!-- notes -->
  <line x1="28" y1="500" x2="732" y2="500" stroke="#1e3a5f" stroke-width="1"/>
  <g font-family="monospace" font-size="9" fill="#6d8bb0">
    <text x="28" y="518">NOTES: PA12 SLS (pilot) · PC-ABS injection (volume) · IP54 · −10 °C to +70 °C cabin rating</text>
    <text x="28" y="534">MOUNT: 20 mm ball joint + 3M VHB · M2 × 4 standoffs · 4-pin JST-GH power/data · 64 GB microSD (side-access)</text>
  </g>
</svg>
